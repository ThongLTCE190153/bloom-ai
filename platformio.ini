[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    madhephaestus/ESP32Servo @ 3.2.1
    bblanchon/ArduinoJson @ 7.4.3
    ricmoo/QRCode @ 0.0.1

; Cấu hình phần cứng cho TFT_eSPI (ST7789 240x320 + Cảm ứng XPT2046)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=27
    -D TFT_RST=4
    -D TOUCH_CS=21
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D SPI_FREQUENCY=40000000
    -D SPI_TOUCH_FREQUENCY=2500000
