[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI
    madhephaestus/ESP32Servo
    bblanchon/ArduinoJson
    ricmoo/QRCode

; Cấu hình phần cứng cho TFT_eSPI (thay đổi chân và driver theo màn hình thực tế của bạn)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1          ; Driver màn hình (vd: ILI9341, ST7789, ST7735,...)
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TOUCH_CS=21
    -D TFT_DC=2
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_TOUCH_FREQUENCY=2500000